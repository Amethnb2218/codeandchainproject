# Render — SENTABAKH LITE (Code & Chain Dakar 2026)
# 1 service web = backend Express + frontend Vite servi en static (client/dist)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sentabakh-lite
    env: node
    plan: free
    region: frankfurt
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_MODE
        value: sandbox
      - key: CORS_ORIGIN
        value: https://sentabakh-lite.onrender.com
      - key: DATABASE_URL
        value: file:./data/sentabakh.db
      # Secrets Bitnob — à renseigner dans le dashboard Render > Environment (jamais committés)
      - key: BITNOB_CLIENT_ID
        sync: false
      - key: BITNOB_CLIENT_SECRET
        sync: false
      - key: BITNOB_WEBHOOK_SECRET
        sync: false
      - key: BITNOB_CUSTOMER_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
